# 发布：main 上的 package.json 版本号一变，就把这个版本发到 npm。
# 版本已存在于 registry 时整条流水线跳过（幂等），改文档等不碰 package.json 的推送不会触发。
# 认证走 npm 可信发布（OIDC），仓库里不存 token；需在 npmjs.com 包设置里加一个 Trusted Publisher：
# 仓库 setwhite/pi-web-search-lite、workflow 文件名 npm-publish.yml。若改用 token，给发布步加
# env: NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} 即可（npm 会优先用 OIDC，回退到 token）。
name: Publish

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # 可信发布换 OIDC 令牌用

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24 # 可信发布要求 Node >= 22.14
          cache: false # 发布构建不用缓存
      - name: 判断该版本是否已发布
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version 已在 registry 上，跳过"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version 未发布，继续"
          fi
      - if: ${{ steps.check.outputs.publish == 'true' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ steps.check.outputs.publish == 'true' }}
        run: pnpm run lint
      - if: ${{ steps.check.outputs.publish == 'true' }}
        run: pnpm run check:imports
      - if: ${{ steps.check.outputs.publish == 'true' }}
        run: pnpm run typecheck
      - if: ${{ steps.check.outputs.publish == 'true' }}
        run: pnpm test
      - if: ${{ steps.check.outputs.publish == 'true' }}
        name: tarball 覆盖全部 files 条目
        run: |
          # 发布前对真实产物再查一遍：package.json 的 files 少写一个目录时，
          # 装在用户侧才会崩，而 lint / test 都是绿的。
          pnpm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json");
            const parsed = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pack.json`, "utf8"));
            const tarball = Array.isArray(parsed) ? parsed[0] : parsed;
            // pnpm 给的是仓库相对路径，npm 给的是 package/ 前缀，统一剥掉再比
            const paths = tarball.files.map((file) => file.path.replace(/^package\//, ""));
            const missing = pkg.files.filter(
              (entry) => !paths.some((path) => path === entry || path.startsWith(`${entry}/`)),
            );
            if (paths.length === 0) throw new Error("tarball 为空");
            if (missing.length > 0) throw new Error(`tarball 缺: ${missing.join(", ")}`);
            console.log(`tarball ${paths.length} 个文件，覆盖 ${pkg.files.length} 项 files`);
          '
      - if: ${{ steps.check.outputs.publish == 'true' }}
        name: 备好支持可信发布的 npm（要求 >= 11.5.1）
        run: |
          # runner 自带的 npm 是 10.x（pnpm/setup 的 runtime 自带），且 `-g` 安装改不动 PATH 上的它，
          # 所以装到独立前缀，发布时直接调那个二进制。
          npm install -g npm@latest --prefix "$RUNNER_TEMP/npm-cli" >/dev/null
          npmbin="$RUNNER_TEMP/npm-cli/bin/npm"
          echo "发布用 npm $("$npmbin" --version)，runner 自带 $(npm --version)"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "缺 OIDC 环境变量，检查 workflow 的 id-token: write"
            exit 1
          fi
          node -e '
            const { execSync } = require("node:child_process");
            const v = execSync(`"${process.argv[1]}" --version`).toString().trim();
            const [a, b, c] = v.split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${v} 太旧，可信发布要求 >= 11.5.1`);
              process.exit(1);
            }
            console.log(`npm ${v} 满足可信发布要求`);
          ' "$npmbin"
      - if: ${{ steps.check.outputs.publish == 'true' }}
        name: 发布到 npm
        run: |
          "$RUNNER_TEMP/npm-cli/bin/npm" publish --access public
